<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Boom Boats - asset gallery</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#aee8ff;--ink:#12343b;--btn:#ffffffd9;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e2a3a;--ink:#e6f7ff;--btn:#16384bd9}}
:root[data-theme="dark"]{--bg:#0e2a3a;--ink:#e6f7ff;--btn:#16384bd9}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
canvas{display:block;width:100%;height:100%;touch-action:none}
#t{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:0;right:0;text-align:center;font-weight:700;letter-spacing:.04em;pointer-events:none}
#t small{display:block;font-weight:500;opacity:.7;letter-spacing:0}
#bar{position:fixed;left:0;right:0;bottom:calc(10px + env(safe-area-inset-bottom,0px));padding:0 10px}
#acts{display:flex;gap:8px;justify-content:center;margin-bottom:8px}
#list{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
button{border:0;border-radius:999px;padding:9px 14px;font:600 13px system-ui;background:var(--btn);color:var(--ink);cursor:pointer;white-space:nowrap;flex:0 0 auto}
button.on{background:#ff7a59;color:#fff}
.sep{flex:0 0 1px;background:var(--ink);opacity:.25;margin:4px 2px}
</style></head><body>
<div id="t"><span id="name"></span><small>drag to rotate</small></div>
<div id="bar"><div id="acts"></div><div id="list"></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>

// Shared helpers for the extra boat / trophy / decoration assets.
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const angleDiff = (a, b) => ((b - a + Math.PI) % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2) - Math.PI;
const std = (color, extra = {}) => new THREE.MeshStandardMaterial({ color, flatShading: true, roughness: 0.75, ...extra });
const glow = (color, opacity = 1, additive = false) => new THREE.MeshBasicMaterial({
  color, transparent: opacity < 1 || additive, opacity, depthWrite: !additive, side: THREE.DoubleSide,
  blending: additive ? THREE.AdditiveBlending : THREE.NormalBlending,
});
const add = (parent, mesh, x = 0, y = 0, z = 0) => { mesh.position.set(x, y, z); parent.add(mesh); return mesh; };
const box = (parent, w, h, d, color, x, y, z) => add(parent, new THREE.Mesh(new THREE.BoxGeometry(w, h, d), std(color)), x, y, z);
// cylinder lying along Z (barrels, engines)
const cylZ = (parent, r, len, color, x, y, z) => {
  const geo = new THREE.CylinderGeometry(r, r, len, 10); geo.rotateX(Math.PI / 2);
  return add(parent, new THREE.Mesh(geo, std(color)), x, y, z);
};

// Loft a hull from cross-sections [z, halfWidth, deckY, keelY]: a real boat silhouette with flat facets.
function loft(stations, color, { bottomTaper = 0.7, widen = 1, band = 0 } = {}) {
  const sec = ([z, hw, top, bot]) => {
    const a = hw * widen, b = hw * bottomTaper * widen, t = top + (band ? 0.02 : 0), bt = band ? top - band : bot;
    return [[-a, t, z], [a, t, z], [band ? a : b, bt, z], [band ? -a : -b, bt, z]];
  };
  const S = stations.map(sec), pos = [], tri = (p, q, r) => pos.push(...p, ...q, ...r);
  for (let i = 0; i < S.length - 1; i++) for (let k = 0; k < 4; k++) {
    const a = S[i][k], b = S[i][(k + 1) % 4], c = S[i + 1][(k + 1) % 4], d = S[i + 1][k];
    tri(a, b, c); tri(a, c, d);
  }
  tri(S[0][0], S[0][1], S[0][2]); tri(S[0][0], S[0][2], S[0][3]);
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.computeVertexNormals();
  return new THREE.Mesh(geo, std(color, { side: THREE.DoubleSide }));
}


// Enemy boat models. Both face +Z like the player's boat and keep a similar footprint
// (the game scales them with ENEMY_TYPES[...].scale).
//   BIG   looks: 'pod' (cruiser), 'twin' (gunboat), 'dread' (dreadnought)
//   SMALL looks: 'sail' (skiff catamaran), 'raider' (angular dart)
// Every model has userData.update(dt, t, boat) and userData.hit().
// Big boats also have userData.aimTurret(worldYaw, hullYaw, dt) and userData.fire().

const BIG = { pod: { stacks: 1, bow: 1, rear: 'missile' }, twin: { stacks: 1, bow: 2, rear: 'twin' }, dread: { stacks: 2, bow: 2, rear: 'triple' } };
const colors = (s) => ({
  hull: s.hull ?? 0xff7aa8, accent: s.accent ?? 0xfff0f5, cabin: s.cabin ?? 0xffc2d6, roof: s.roof ?? 0xe84a82,
  flag: s.flag ?? 0xffffff, dark: 0x3b4452, neon: 0xffe066,
});

function hitFlasher(mats) {
  let k = 0;
  return { hit: () => { k = 1; }, step: (dt) => { k = Math.max(0, k - dt * 4); mats.forEach((m) => m.emissive.setRGB(k * 0.9, k * 0.1, k * 0.05)); } };
}

// ---------------------------------------------------------------- BIG BOATS
function buildBigBoat(style = {}) {
  const look = BIG[style.look] ? style.look : 'pod', P = BIG[look], C = colors(style);
  const g = new THREE.Group(); g.rotation.order = 'YXZ';
  const mats = [];

  // armoured hull: wide, tall, heavy
  const st = [[-3, 1.35, 0.8, -0.3], [-2, 1.5, 0.85, -0.35], [0, 1.5, 0.9, -0.35], [1.6, 1.35, 0.9, -0.25], [3, 0.9, 0.88, -0.05], [4, 0.4, 0.9, 0.2], [4.7, 0.05, 0.95, 0.45]];
  const hull = loft(st, C.hull, { bottomTaper: 0.78 }), rail = loft(st, C.accent, { band: 0.22, widen: 1.03 });
  g.add(hull, rail, loft(st.map(([z, hw, t, b]) => [z, hw * 0.4, b + 0.1, b - 0.2]), C.dark, { bottomTaper: 0.6 }));
  mats.push(hull.material, rail.material);
  for (const s of [-1, 1]) add(g, new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.08, 4.2), glow(C.neon)), s * 1.42, 0.5, -0.4); // lit waterline stripe

  // bridge, mast with spinning radar, smokestacks
  box(g, 1.7, 1.05, 1.5, C.cabin, 0, 1.4, 0.7);
  box(g, 1.95, 0.2, 1.75, C.roof, 0, 2.02, 0.7);
  add(g, new THREE.Mesh(new THREE.BoxGeometry(1.3, 0.16, 0.05), glow(0x8eeaff)), 0, 1.65, 1.46); // bridge windows
  const radar = new THREE.Group(); add(g, radar, 0, 3.1, 0.7);
  add(radar, new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 1.0, 5), std(0xffffff)), 0, -0.55, 0);
  box(radar, 1.2, 0.12, 0.25, C.dark, 0, 0, 0);
  for (let i = 0; i < P.stacks; i++) {
    const z = -0.6 - i * 0.95;
    add(g, new THREE.Mesh(new THREE.CylinderGeometry(0.34, 0.4, 1.5, 8), std(C.dark)), 0, 1.6, z);
    add(g, new THREE.Mesh(new THREE.CylinderGeometry(0.37, 0.37, 0.22, 8), std(C.accent)), 0, 2.3, z);
  }
  const flag = add(g, new THREE.Mesh(new THREE.PlaneGeometry(0.9, 0.5), std(C.flag, { side: THREE.DoubleSide })), 0, 3.5, 0.7 - 0.45);
  flag.rotation.y = Math.PI / 2;

  // FRONT: normal fixed guns on the bow
  const bowBarrels = [];
  for (const s of [-1, 1]) {
    box(g, 0.55, 0.4, 1.0, C.dark, s * 0.62, 1.1, 2.55);
    for (let i = 0; i < P.bow; i++) {
      const x = s * (0.62 + (i - (P.bow - 1) / 2) * 0.26);
      bowBarrels.push(cylZ(g, 0.1, 1.9, C.dark, x, 1.2, 3.3));
      cylZ(g, 0.13, 0.16, C.accent, x, 1.2, 4.2); // muzzle ring
    }
  }

  // REAR: the movable turret. Pivot sits on the deck behind the bridge.
  const turret = new THREE.Group(); add(g, turret, 0, 0.9, -1.75);
  add(turret, new THREE.Mesh(new THREE.CylinderGeometry(0.82, 0.92, 0.22, 14), std(C.dark)), 0, 0.11, 0);   // ring mount
  add(turret, new THREE.Mesh(new THREE.CylinderGeometry(0.62, 0.7, 0.5, 6), std(C.accent)), 0, 0.47, 0);      // armoured body
  add(turret, new THREE.Mesh(new THREE.SphereGeometry(0.5, 10, 6, 0, Math.PI * 2, 0, Math.PI / 2), std(C.roof)), 0, 0.72, 0);
  add(turret, new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.06, 0.14), glow(C.neon)), 0, 0.62, 0.62); // front sight light
  const guns = new THREE.Group(); add(turret, guns, 0, 0.55, 0.35);
  const barrels = [];
  if (P.rear === 'missile') {
    box(guns, 0.95, 0.42, 1.3, C.dark, 0, 0, 0.45);
    for (const x of [-0.25, 0.25]) for (const y of [-0.08, 0.14]) {
      barrels.push(cylZ(guns, 0.11, 1.5, 0xf2f2f2, x, y, 0.55));
      const tip = add(guns, new THREE.Mesh(new THREE.ConeGeometry(0.11, 0.3, 8), std(0xff4d4d)), x, y, 1.42); tip.rotation.x = Math.PI / 2;
    }
  } else {
    const n = P.rear === 'triple' ? 3 : 2, r = P.rear === 'triple' ? 0.12 : 0.15;
    box(guns, 0.3 + n * 0.28, 0.4, 0.7, C.dark, 0, 0, 0.25);
    for (let i = 0; i < n; i++) {
      const x = (i - (n - 1) / 2) * 0.3;
      barrels.push(cylZ(guns, r, 2.0, C.dark, x, 0, 1.2));
      cylZ(guns, r + 0.04, 0.18, C.accent, x, 0, 2.15);
    }
  }
  const barrelZ = barrels.map((b) => b.position.z);

  // engines
  for (const s of [-1, 1]) { cylZ(g, 0.38, 1.1, C.dark, s * 0.7, 0.3, -3.2); cylZ(g, 0.42, 0.1, C.accent, s * 0.7, 0.3, -3.78); }

  const f = hitFlasher(mats);
  let rel = 0, recoil = 0;
  g.userData.turret = turret;
  // Turns the turret toward a WORLD yaw at a limited rate (it lags behind fast targets).
  // Returns the turret's current WORLD yaw so the AI can shoot along it.
  g.userData.aimTurret = (worldYaw, hullYaw, dt, rate = 2.4) => {
    const d = angleDiff(rel, angleDiff(0, worldYaw - hullYaw));
    rel = angleDiff(0, rel + clamp(d, -rate * dt, rate * dt));
    turret.rotation.y = rel;
    return hullYaw + rel;
  };
  g.userData.turretRel = () => rel;
  g.userData.fire = () => { recoil = 1; };
  g.userData.hit = f.hit;
  g.userData.update = (dt, t, boat) => {
    radar.rotation.y += dt * 2.2;
    recoil = Math.max(0, recoil - dt * 7);
    barrels.forEach((b, i) => { b.position.z = barrelZ[i] - recoil * 0.35; });
    flag.rotation.x = Math.sin(t * 9) * 0.12 * (1 + clamp((boat?.state?.speed || 0) / 100, 0, 1));
    f.step(dt);
  };
  g.scale.setScalar(style.scale || 1);
  return g;
}

// -------------------------------------------------------------- SMALL BOATS
function buildSmallBoat(style = {}) {
  const look = style.look === 'raider' ? 'raider' : 'sail', C = colors({ hull: 0xffa62b, accent: 0xffffff, cabin: 0xffe0a3, roof: 0xff7a1a, flag: 0xffffff, ...style });
  const g = new THREE.Group(); g.rotation.order = 'YXZ';
  const mats = [], anim = {};

  if (look === 'sail') {
    // catamaran skiff: two pontoons, open deck, tyre fenders, a sail and a swivel gun
    const pst = [[-2.3, 0.4, 0.5, -0.15], [-1, 0.45, 0.5, -0.2], [1.2, 0.4, 0.5, -0.1], [2.6, 0.22, 0.5, 0.05], [3.5, 0.03, 0.55, 0.3]];
    for (const s of [-1, 1]) {
      const p = loft(pst, C.hull, { bottomTaper: 0.8 }); p.position.x = s * 0.95; g.add(p); mats.push(p.material);
      for (const z of [-1.2, 0.2, 1.4]) { const tyre = add(g, new THREE.Mesh(new THREE.TorusGeometry(0.2, 0.08, 6, 12), std(0x2b2f3a)), s * 1.38, 0.3, z); tyre.rotation.y = Math.PI / 2; }
    }
    box(g, 1.9, 0.14, 3.6, C.accent, 0, 0.62, -0.1);                 // deck
    box(g, 1.1, 0.7, 1.0, C.cabin, 0, 1.0, -0.8); box(g, 1.3, 0.12, 1.2, C.roof, 0, 1.4, -0.8);
    add(g, new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 4.4, 5), std(0xffffff)), 0, 2.8, 0.7); // mast
    const sh = new THREE.Shape(); sh.moveTo(0, 0); sh.lineTo(2.6, 0); sh.lineTo(0, 3.9);
    const sg = new THREE.ShapeGeometry(sh); sg.rotateY(Math.PI / 2);
    add(g, new THREE.Mesh(sg, std(0xffffff, { side: THREE.DoubleSide })), 0, 0.8, 0.7);
    const stripe = new THREE.Shape(); stripe.moveTo(0.4, 0.4); stripe.lineTo(1.7, 0.4); stripe.lineTo(0.9, 1.9); stripe.lineTo(0.4, 1.9);
    const tg = new THREE.ShapeGeometry(stripe); tg.rotateY(Math.PI / 2);
    for (const dz of [0.012, -0.012]) add(g, new THREE.Mesh(tg, std(C.roof, { side: THREE.DoubleSide })), 0, 0.8, 0.7 + dz);
    add(g, new THREE.Mesh(new THREE.SphereGeometry(0.28, 8, 6), std(C.dark)), 0, 0.95, 2.2);       // swivel gun ball
    cylZ(g, 0.09, 1.3, C.dark, 0, 1.0, 3.0); cylZ(g, 0.12, 0.14, C.accent, 0, 1.0, 3.68);
    box(g, 0.5, 0.7, 0.4, C.dark, 0, 0.75, -2.5);                                                     // outboard motor
    anim.prop = add(g, new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.08, 0.06), std(0xcfd6df)), 0, 0.45, -2.78);
    const pen = add(g, new THREE.Mesh(new THREE.PlaneGeometry(0.8, 0.4), std(C.roof, { side: THREE.DoubleSide })), 0, 5.0, 0.3);
    pen.rotation.y = Math.PI / 2; anim.pen = pen;
  } else {
    // raider: low angular dart with a glowing visor, twin gun pods and a swept tail
    const st = [[-2.4, 0.9, 0.5, -0.1], [-0.6, 1.0, 0.55, -0.15], [1.2, 0.8, 0.55, -0.05], [2.8, 0.35, 0.5, 0.15], [4.0, 0.03, 0.5, 0.3]];
    const hull = loft(st, C.hull, { bottomTaper: 0.45 }), rail = loft(st, C.accent, { band: 0.12, widen: 1.02 });
    g.add(hull, rail); mats.push(hull.material, rail.material);
    const cock = add(g, new THREE.Mesh(new THREE.SphereGeometry(1, 10, 8), std(0x14202e, { transparent: true, opacity: 0.85 })), 0, 0.72, 0.7);
    cock.scale.set(0.55, 0.3, 1.0);
    add(g, new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.06, 0.06), glow(C.accent)), 0, 0.82, 1.5); // visor light
    for (const s of [-1, 1]) {
      box(g, 0.34, 0.3, 1.3, C.dark, s * 1.05, 0.5, 1.5);                                          // gun pods
      cylZ(g, 0.07, 1.5, C.dark, s * 1.05, 0.5, 2.7); cylZ(g, 0.1, 0.1, C.accent, s * 1.05, 0.5, 3.4);
      const fin = box(g, 0.12, 1.0, 1.4, C.accent, s * 0.85, 0.95, -2.0); fin.rotation.z = -s * 0.28; fin.rotation.x = -0.15; // swept tail fins
      add(g, new THREE.Mesh(new THREE.SphereGeometry(0.08, 6, 5), glow(C.accent)), s * 1.1, 1.45, -2.45);
    }
    cylZ(g, 0.5, 0.9, C.dark, 0, 0.4, -2.7); cylZ(g, 0.54, 0.1, C.accent, 0, 0.4, -3.2);
    const fl = new THREE.ConeGeometry(0.4, 1, 10); fl.rotateX(-Math.PI / 2); fl.translate(0, 0, -0.5);
    anim.flame = add(g, new THREE.Mesh(fl, glow(C.accent, 0.7, true)), 0, 0.4, -3.25);
  }

  const f = hitFlasher(mats);
  g.userData.hit = f.hit;
  g.userData.update = (dt, t, boat) => {
    const sp = clamp((boat?.state?.speed || 0) / 100, 0, 1.4);
    if (anim.prop) anim.prop.rotation.z += dt * (8 + sp * 40);
    if (anim.pen) anim.pen.rotation.x = Math.sin(t * 12) * (0.12 + sp * 0.2);
    if (anim.flame) { const k = (0.5 + sp * 1.6) * (0.9 + Math.sin(t * 55) * 0.1); anim.flame.scale.set(1, 1, k); }
    f.step(dt);
  };
  g.scale.setScalar(style.scale || 1);
  return g;
}

// One call for boat.js: returns a model for any enemy look, or null for the old default builder.
function buildEnemyBoat(style) {
  if (BIG[style.look]) return buildBigBoat(style);
  if (style.look === 'sail' || style.look === 'raider') return buildSmallBoat(style);
  return null;
}


// The trophy: gold hexagon badge with a raised star, stacked wings, gold neck, navy pedestal with a white plate,
// and a bit of confetti. Faces +Z. About 6 units tall at scale 1.
//   buildTrophy()                  floating on the sea like a potion: life ring, golden beam, bobbing, slow spin
//   buildTrophy({ carried: true }) small version to ride above the boat that holds it (no ring / beam)
// userData.tick(t, dt)  call every frame.   userData.setHeld(bool)  dims the beam/ring and makes it sparkle faster.

const GOLD = 0xffb92e, GOLD_L = 0xffd45a, ORANGE = 0xf08a1c, NAVY = 0x1b2142, NAVY_L = 0x2a3466;
const CONFETTI = [0x4cd964, 0x39d0e6, 0xff7a6b, 0xffd54a, 0xff7ab8];

function hexPrism(r, depth, color, extra) {
  const geo = new THREE.CylinderGeometry(r, r, depth, 6); geo.rotateX(Math.PI / 2); // points up/down, faces +Z
  const m = new THREE.Mesh(geo, std(color, extra)); m.scale.y = 1.06; return m;
}

function starGeo(outer, inner, depth) {
  const s = new THREE.Shape();
  for (let i = 0; i < 10; i++) {
    const a = Math.PI / 2 + (i * Math.PI) / 5, r = i % 2 ? inner : outer;
    i ? s.lineTo(Math.cos(a) * r, Math.sin(a) * r) : s.moveTo(Math.cos(a) * r, Math.sin(a) * r);
  }
  s.closePath();
  const geo = new THREE.ExtrudeGeometry(s, { depth, bevelEnabled: true, bevelSize: 0.05, bevelThickness: 0.05, bevelSegments: 1 });
  geo.translate(0, 0, -depth / 2);
  return geo;
}

function wingGeo(len, h) {
  const s = new THREE.Shape(); s.moveTo(0, 0); s.lineTo(len, h * 0.7); s.lineTo(len, h * 1.6); s.lineTo(0, h);
  s.closePath();
  const geo = new THREE.ExtrudeGeometry(s, { depth: 0.36, bevelEnabled: false }); geo.translate(0, 0, -0.18);
  return geo;
}

function buildTrophy({ carried = false } = {}) {
  const root = new THREE.Group();
  const body = new THREE.Group(); root.add(body);

  // navy pedestal with a white name plate
  box(body, 3.4, 0.45, 2.2, NAVY, 0, 0.225, 0);
  box(body, 3.1, 0.1, 1.9, NAVY_L, 0, 0.5, 0);
  box(body, 2.3, 0.75, 1.5, NAVY, 0, 0.92, 0);
  box(body, 2.5, 0.12, 1.7, NAVY_L, 0, 1.34, 0);
  box(body, 1.3, 0.32, 0.06, 0xf6f4ee, 0, 0.9, 0.77);

  // gold neck
  const neck = new THREE.LatheGeometry([[0.95, 0], [0.6, 0.16], [0.3, 0.5], [0.28, 0.85], [0.5, 1.05], [0.01, 1.05]].map(([x, y]) => new THREE.Vector2(x, y)), 14);
  add(body, new THREE.Mesh(neck, std(GOLD, { emissive: 0x6a3a00, emissiveIntensity: 0.25 })), 0, 1.4, 0);

  // badge: outer hex, bevel ring, darker recess, raised star
  const badge = new THREE.Group(); add(body, badge, 0, 3.95, 0);
  badge.add(hexPrism(1.6, 0.5, GOLD, { emissive: 0x6a3a00, emissiveIntensity: 0.2 }));
  add(badge, hexPrism(1.42, 0.1, GOLD_L), 0, 0, 0.27);
  add(badge, hexPrism(1.1, 0.08, ORANGE), 0, 0, 0.32);
  const star = add(badge, new THREE.Mesh(starGeo(0.66, 0.29, 0.14), std(GOLD_L, { emissive: 0xffa800, emissiveIntensity: 0.45 })), 0, 0.02, 0.42);
  // wings: two stacked slabs on each side
  for (const s of [-1, 1]) {
    const up = add(badge, new THREE.Mesh(wingGeo(1.6, 0.34), std(GOLD_L)), s * 1.35, 0.1, 0);
    const lo = add(badge, new THREE.Mesh(wingGeo(1.3, 0.3), std(GOLD)), s * 1.35, -0.62, 0);
    if (s < 0) { up.scale.x = lo.scale.x = -1; }
  }

  // confetti
  const bits = [];
  for (let i = 0; i < 12; i++) {
    const isDot = i % 4 === 3;
    const m = new THREE.Mesh(isDot ? new THREE.SphereGeometry(0.09, 6, 5) : new THREE.PlaneGeometry(0.34, 0.17),
      isDot ? std(i % 8 === 3 ? NAVY : GOLD_L) : glow(CONFETTI[i % CONFETTI.length]));
    const a = (i / 12) * Math.PI * 2, r = 2.3 + (i % 3) * 0.5;
    add(body, m, Math.cos(a) * r, 1.6 + (i % 5) * 0.85, Math.sin(a) * r * 0.7);
    bits.push({ m, a, r, y: m.position.y, ph: i * 1.7 });
  }

  // sea gear: life ring + golden beam
  let ring = null, beam = null;
  if (!carried) {
    ring = new THREE.Group(); add(root, ring, 0, 0.05, 0);
    const base = new THREE.Mesh(new THREE.TorusGeometry(2.7, 0.4, 8, 28), std(0xf6f4ee)); base.rotation.x = Math.PI / 2; ring.add(base);
    for (let i = 0; i < 4; i++) {
      const arc = new THREE.Mesh(new THREE.TorusGeometry(2.7, 0.42, 8, 8, Math.PI / 4), std(0xff7a59)); arc.rotation.x = Math.PI / 2; arc.rotation.z = (i * Math.PI) / 2; ring.add(arc);
    }
    beam = add(root, new THREE.Mesh(new THREE.CylinderGeometry(1.1, 2.0, 46, 18, 1, true), glow(0xffd45a, 0.1, true)), 0, 23, 0);
  }
  root.scale.setScalar(carried ? 0.42 : 1);

  let held = false;
  root.userData.setHeld = (v) => { held = !!v; };
  root.userData.tick = (t, dt = 0.016) => {
    body.position.y = Math.sin(t * 1.8) * (carried ? 0.1 : 0.18);
    body.rotation.y += dt * (held ? 1.4 : 0.6);                          // slow showy spin
    if (ring) { ring.rotation.z = Math.sin(t * 1.3) * 0.05; ring.rotation.x = Math.cos(t * 1.1) * 0.04; } // rocks with the waves
    star.rotation.z = Math.sin(t * 2.2) * 0.06;
    star.material.emissiveIntensity = 0.45 + Math.sin(t * 4) * 0.25;
    if (beam) beam.material.opacity = (held ? 0.05 : 0.1) + Math.sin(t * 3) * 0.02;
    for (const b of bits) {
      const sp = held ? 1.8 : 1;
      b.m.position.set(Math.cos(b.a + t * 0.35 * sp) * b.r, b.y + Math.sin(t * 1.6 * sp + b.ph) * 0.35, Math.sin(b.a + t * 0.35 * sp) * b.r * 0.7);
      b.m.rotation.set(t * 2 + b.ph, t * 1.5, t * 2.5);
    }
  };
  return root;
}


// Extra land decorations for the map editor. Same contract as assets.js: makeXxx(def) -> THREE.Group,
// sitting on y = 0, scaled/rotated/positioned by makeAsset. Animated ones set group.userData.tick(t).
// Hooked up through EXTRA_MAKERS (type -> builder) and EXTRA_CATALOG (palette entries).

const rng = (seed) => () => { seed = (seed + 0x6d2b79f5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
const cyl = (p, rt, rb, h, color, x, y, z, seg = 10) => add(p, new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg), std(color)), x, y, z);

// ---------------------------------------------------------------- windmill
function makeWindmill() {
  const g = new THREE.Group();
  cyl(g, 1.3, 1.9, 4.2, 0xe8dcc0, 0, 2.1, 0, 10);                         // stone tower
  cyl(g, 1.95, 1.95, 0.25, 0x9a8f78, 0, 0.12, 0, 10);                     // plinth
  cyl(g, 1.4, 1.4, 0.14, 0xb56a3f, 0, 2.6, 0, 10);                        // timber band
  cyl(g, 0, 1.75, 1.7, 0xc2552d, 0, 5.05, 0, 10);                         // roof
  box(g, 0.7, 1.2, 0.2, 0x6b4426, 0, 0.7, 1.72);                          // door
  for (const [y, a] of [[3.1, 0.6], [3.1, -0.6], [1.9, Math.PI]]) {       // windows
    const w = box(g, 0.4, 0.5, 0.12, 0x8eeaff, Math.sin(a) * 1.5, y, Math.cos(a) * 1.5); w.rotation.y = a;
  }
  const blades = new THREE.Group(); add(g, blades, 0, 4.0, 1.75);
  add(blades, new THREE.Mesh(new THREE.SphereGeometry(0.3, 8, 6), std(0x4a3320)), 0, 0, 0.1);
  for (let i = 0; i < 4; i++) {
    const arm = new THREE.Group(); arm.rotation.z = (i * Math.PI) / 2; blades.add(arm);
    box(arm, 0.14, 3.6, 0.1, 0x6b4426, 0, 1.9, 0);
    box(arm, 0.8, 2.3, 0.05, 0xf6efe0, 0.46, 2.3, 0.02);
    box(arm, 0.8, 0.08, 0.07, 0xc2552d, 0.46, 1.2, 0.02);
  }
  g.userData.tick = (t) => { blades.rotation.z = t * 0.9; };
  return g;
}

// ---------------------------------------------------------------- fountain
function makeFountain() {
  const g = new THREE.Group(), stone = 0xd7d2c4, water = 0x5ad2f0;
  cyl(g, 2.7, 2.8, 0.55, stone, 0, 0.27, 0, 14);
  add(g, new THREE.Mesh(new THREE.TorusGeometry(2.65, 0.14, 6, 24), std(0xbfb9a8)), 0, 0.58, 0).rotation.x = Math.PI / 2;
  add(g, new THREE.Mesh(new THREE.CircleGeometry(2.5, 20), glow(water, 0.8)), 0, 0.5, 0).rotation.x = -Math.PI / 2;
  cyl(g, 0.5, 0.7, 1.4, stone, 0, 1.2, 0, 10);
  cyl(g, 1.35, 0.7, 0.45, stone, 0, 1.75, 0, 12);                         // upper bowl
  add(g, new THREE.Mesh(new THREE.CircleGeometry(1.2, 16), glow(water, 0.85)), 0, 1.98, 0).rotation.x = -Math.PI / 2;
  cyl(g, 0.22, 0.3, 1.0, stone, 0, 2.45, 0, 8);
  add(g, new THREE.Mesh(new THREE.SphereGeometry(0.3, 8, 6), std(0xffd45a)), 0, 3.05, 0);
  const drops = [];
  for (let i = 0; i < 14; i++) {
    const d = add(g, new THREE.Mesh(new THREE.SphereGeometry(0.1, 6, 5), glow(0xbff2ff, 0.9)), 0, 3, 0);
    drops.push({ d, a: (i / 14) * Math.PI * 2, ph: (i % 7) / 7 });
  }
  g.userData.tick = (t) => drops.forEach((o) => {
    const k = (t * 0.9 + o.ph) % 1, r = Math.sin(k * Math.PI) * 1.1 + k * 0.4;
    o.d.position.set(Math.cos(o.a) * r, 3.1 + Math.sin(k * Math.PI) * 0.9 - k * k * 1.1, Math.sin(o.a) * r);
  });
  return g;
}

// ------------------------------------------------------------ flower garden
function makeFlowerGarden(def = {}) {
  const g = new THREE.Group(), r = rng(def.seed || 7), pal = [0xff5c8a, 0xffd54a, 0xffffff, 0xb48cff, 0xff8a3d];
  cyl(g, 2.5, 2.6, 0.3, 0x6b4a2e, 0, 0.15, 0, 16);
  for (let i = 0; i < 14; i++) {                                          // stone border
    const a = (i / 14) * Math.PI * 2, s = add(g, new THREE.Mesh(new THREE.DodecahedronGeometry(0.34, 0), std(0xb9b3a3)), Math.cos(a) * 2.6, 0.22, Math.sin(a) * 2.6);
    s.scale.y = 0.7;
  }
  for (let i = 0; i < 22; i++) {
    const a = r() * Math.PI * 2, d = Math.sqrt(r()) * 2.1, x = Math.cos(a) * d, z = Math.sin(a) * d, h = 0.5 + r() * 0.6, col = pal[Math.floor(r() * pal.length)];
    cyl(g, 0.03, 0.04, h, 0x3fcf6e, x, 0.3 + h / 2, z, 4);
    add(g, new THREE.Mesh(new THREE.SphereGeometry(0.09, 6, 5), std(0xffd54a)), x, 0.3 + h + 0.03, z);
    for (let p = 0; p < 5; p++) {
      const pa = (p / 5) * Math.PI * 2, pet = add(g, new THREE.Mesh(new THREE.SphereGeometry(0.1, 6, 5), std(col)), x + Math.cos(pa) * 0.14, 0.3 + h, z + Math.sin(pa) * 0.14);
      pet.scale.y = 0.6;
    }
  }
  for (let i = 0; i < 4; i++) { const a = r() * 6.28, b = add(g, new THREE.Mesh(new THREE.IcosahedronGeometry(0.4, 0), std(0x3fcf6e)), Math.cos(a) * 1.6, 0.5, Math.sin(a) * 1.6); b.scale.y = 0.8; }
  return g;
}

// ---------------------------------------------------------- crystal cluster
function makeCrystalCluster(def = {}) {
  const g = new THREE.Group(), r = rng(def.seed || 3), cols = [0x9a86ff, 0x39e6ff, 0xc9a8ff], mats = [];
  for (let i = 0; i < 4; i++) { const a = (i / 4) * 6.28, rk = add(g, new THREE.Mesh(new THREE.DodecahedronGeometry(0.8, 0), std(0x6c6a86)), Math.cos(a) * 1.0, 0.3, Math.sin(a) * 1.0); rk.scale.y = 0.6; }
  for (let i = 0; i < 8; i++) {
    const a = (i / 8) * 6.28 + r(), d = i ? 0.7 + r() * 0.9 : 0, h = i ? 1.4 + r() * 1.6 : 3.6, w = i ? 0.28 + r() * 0.2 : 0.5;
    const m = new THREE.MeshStandardMaterial({ color: cols[i % 3], emissive: cols[i % 3], emissiveIntensity: 0.55, flatShading: true, transparent: true, opacity: 0.92, roughness: 0.2 });
    const c = add(g, new THREE.Mesh(new THREE.OctahedronGeometry(1, 0), m), Math.cos(a) * d, h * 0.5 + 0.2, Math.sin(a) * d);
    c.scale.set(w, h * 0.5, w); c.rotation.set((r() - 0.5) * 0.35, r() * 6, (r() - 0.5) * 0.35);
    mats.push(m);
  }
  g.userData.tick = (t) => mats.forEach((m, i) => { m.emissiveIntensity = 0.5 + Math.sin(t * 1.8 + i) * 0.25; });
  return g;
}

const treasureMod=(()=>{

// Floating treasure chest (blue-violet wood, mauve straps, gold corner caps, teal studs, central latch with a loop handle).
// Faces +Z (latch side). About 3.6 units wide / 3.2 tall at scale 1.
//   buildFloatingTreasure()               floats on the sea: life ring, teal beam, bobbing, glints, gold light leaking from the seam
//   buildFloatingTreasure({ float:false}) chest only (for land decoration)
// userData.tick(t, dt)  every frame.   userData.open()  lid flips up, light burst, coins fly out (use on pickup).   userData.close()  resets.

const WOOD = 0x3a4a9e, WOOD_D = 0x2e3b88, LID = 0x4a78c8, LID_HI = 0x6fb6ff, STRAP = 0x9a6f84, STRAP_D = 0x7d5a70, GOLD = 0xd9a52b, TEAL = 0x3fc2c9;
const R = 1.05; // lid radius (half the chest depth)

// half-cylinder shell lying along X: used for the lid, its colour bands and the straps
function arch(radius, length, color, { thetaStart = 0, thetaLen = Math.PI, open = true, extra = {} } = {}) {
  const geo = new THREE.CylinderGeometry(radius, radius, length, 24, 1, open, thetaStart, thetaLen); geo.rotateZ(Math.PI / 2);
  return new THREE.Mesh(geo, std(color, { side: THREE.DoubleSide, ...extra }));
}

function buildFloatingTreasure({ float = true } = {}) {
  const root = new THREE.Group();
  const body = new THREE.Group(); root.add(body);               // bobs and rocks
  const chest = new THREE.Group(); add(body, chest, 0, 0.3, 0);

  // ---- body: planks, trim, corner straps, gold caps with teal studs ----
  box(chest, 2.9, 1.4, 2.1, WOOD, 0, 0.7, 0);
  box(chest, 3.05, 0.22, 2.25, STRAP_D, 0, 1.33, 0);
  box(chest, 3.05, 0.28, 2.25, STRAP_D, 0, 0.16, 0);
  const stud = (x, y, z, ry) => { const s = add(chest, new THREE.Mesh(new THREE.SphereGeometry(0.12, 8, 6), std(TEAL, { emissive: 0x0e6a72, emissiveIntensity: 0.5 })), x, y, z); s.scale.z = 0.5; s.rotation.y = ry; };
  for (const sx of [-1, 1]) for (const sz of [-1, 1]) {
    const x = sx * 1.43, z = sz * 1.03;
    box(chest, 0.36, 1.4, 0.36, STRAP, x, 0.7, z);
    for (const y of [1.28, 0.2]) {
      box(chest, 0.56, y > 1 ? 0.46 : 0.4, 0.56, GOLD, x, y, z);
      stud(x, y, z + sz * 0.29, sz > 0 ? 0 : Math.PI);
      stud(x + sx * 0.29, y, z, sx * Math.PI / 2);
    }
    stud(x, 0.72, z + sz * 0.19, sz > 0 ? 0 : Math.PI);
  }
  // inset panels with gold diamond emblems (front, back, both sides)
  const emblem = (x, z, ry) => {
    const g = new THREE.Group(); add(chest, g, x, 0.75, z); g.rotation.y = ry;
    box(g, 0.85, 0.8, 0.04, WOOD_D, 0, 0, 0);
    add(g, new THREE.Mesh(new THREE.RingGeometry(0.2, 0.3, 4), std(GOLD, { side: THREE.DoubleSide })), 0, 0, 0.04);
  };
  emblem(-0.85, 1.07, 0); emblem(0.85, 1.07, 0); emblem(-0.7, -1.07, Math.PI); emblem(0.7, -1.07, Math.PI);
  emblem(1.47, -0.1, Math.PI / 2); emblem(-1.47, -0.1, -Math.PI / 2);

  // ---- front latch: gold bar with a pointed tip ----
  box(chest, 0.55, 0.7, 0.1, GOLD, 0, 0.98, 1.12);
  const tip = box(chest, 0.39, 0.39, 0.1, GOLD, 0, 0.6, 1.12); tip.rotation.z = Math.PI / 4;
  const seam = add(chest, new THREE.Mesh(new THREE.BoxGeometry(2.8, 0.05, 0.05), glow(0xffd45a, 0.9, true)), 0, 1.4, 1.08); // gold light leaking from the lid

  // ---- lid: hinged at the back, blue glow bands, mauve arch straps, studs, gems, loop handle ----
  const lid = new THREE.Group(); add(chest, lid, 0, 1.4, -1.05);
  const arc = new THREE.Group(); add(lid, arc, 0, 0, 1.05); // arc centre
  arc.add(arch(R, 2.95, LID, { open: false, extra: { emissive: 0x14336b, emissiveIntensity: 0.5 } }));
  for (const [a, l] of [[0.35, 0.3], [0.85, 0.3]]) arc.add(arch(R + 0.015, 2.9, LID_HI, { thetaStart: a, thetaLen: l, extra: { emissive: 0x3a86ff, emissiveIntensity: 0.9 } }));
  const at = (th, rr = R) => [Math.sin(th) * rr, Math.cos(th) * rr]; // [y, z] on the arc
  for (const sx of [-1, 1]) {
    const strap = arch(R + 0.07, 0.42, STRAP); strap.position.x = sx * 1.1; arc.add(strap);
    const [py] = at(Math.PI / 2, R + 0.1);
    const dome = add(arc, new THREE.Mesh(new THREE.SphereGeometry(0.17, 8, 6), std(TEAL, { emissive: 0x0e6a72, emissiveIntensity: 0.5 })), sx * 1.1, py, 0); dome.scale.y = 0.6;
    for (const th of [0.5, 1.05]) {
      const [gy, gz] = at(th, R + 0.12);
      add(arc, new THREE.Mesh(new THREE.OctahedronGeometry(0.1, 0), std(0xbff6ff, { emissive: 0x6fe8ff, emissiveIntensity: 0.8 })), sx * 1.1, gy, gz);
    }
  }
  const th = 0.75, [hy, hz] = at(th, R + 0.06);                 // loop handle standing on the lid front
  const loop = new THREE.Group(); add(arc, loop, 0, hy, hz); loop.rotation.x = -th;
  for (const x of [-0.22, 0.22]) box(loop, 0.1, 0.5, 0.09, GOLD, x, 0.25, 0.04);
  box(loop, 0.54, 0.1, 0.09, GOLD, 0, 0.52, 0.04);
  const [cy, cz] = at(0.35, R + 0.06);                          // clasp where the latch meets the lid
  const clasp = box(arc, 0.6, 0.5, 0.14, GOLD, 0, cy + 0.05, cz); clasp.rotation.x = -0.35;

  // ---- float gear ----
  let ring = null, beam = null;
  if (float) {
    ring = new THREE.Group(); add(root, ring, 0, 0.05, 0);
    const base = new THREE.Mesh(new THREE.TorusGeometry(2.6, 0.38, 8, 30), std(0xf6f4ee)); base.rotation.x = Math.PI / 2; ring.add(base);
    for (let i = 0; i < 4; i++) { const a = new THREE.Mesh(new THREE.TorusGeometry(2.6, 0.4, 8, 8, Math.PI / 4), std(TEAL)); a.rotation.x = Math.PI / 2; a.rotation.z = (i * Math.PI) / 2; ring.add(a); }
    beam = add(root, new THREE.Mesh(new THREE.CylinderGeometry(1.0, 1.9, 46, 18, 1, true), glow(0x7fe0ff, 0.1, true)), 0, 23, 0);
  }

  // glints, burst light and coins
  const starShape = new THREE.Shape();
  for (let i = 0; i < 8; i++) { const a = (i * Math.PI) / 4, r = i % 2 ? 0.07 : 0.26; i ? starShape.lineTo(Math.cos(a) * r, Math.sin(a) * r) : starShape.moveTo(r, 0); }
  const glints = [];
  for (let i = 0; i < 6; i++) {

    m.visible = false; coins.push({ m, v: new THREE.Vector3(), age: 9 });
  }

  let openK = 0, isOpen = false, burstT = 9;
  const api = root.userData;
  api.open = () => {
    if (isOpen) return; isOpen = true; burstT = 0;
    for (const c of coins) { c.age = 0; c.m.visible = true; c.m.position.set(0, 1.4, 0); c.v.set((Math.random() - 0.5) * 5, 6 + Math.random() * 4, (Math.random() - 0.3) * 4); }
  };
  api.close = () => { isOpen = false; for (const c of coins) c.m.visible = false; };
  api.isOpen = () => isOpen;
  api.tick = (t, dt = 0.016) => {
    body.position.y = Math.sin(t * 1.7) * 0.16;
    body.rotation.z = Math.sin(t * 1.2) * 0.05; body.rotation.x = Math.cos(t * 1.0) * 0.04;
    if (ring) { ring.rotation.z = Math.sin(t * 1.3) * 0.05; ring.rotation.x = Math.cos(t * 1.1) * 0.04; }
    openK += ((isOpen ? 1 : 0) - openK) * (1 - Math.exp(-9 * dt));
    lid.rotation.x = -(0.02 + 0.015 * Math.sin(t * 3)) * (1 - openK) - openK * 1.25;   // idle: breathes ajar; open: flips up
    seam.material.opacity = (0.5 + Math.sin(t * 3) * 0.3) * (1 - openK);
    if (beam) beam.material.opacity = 0.09 + Math.sin(t * 3) * 0.02 + (burstT < 0.8 ? (0.8 - burstT) * 0.25 : 0);
